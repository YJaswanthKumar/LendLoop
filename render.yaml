services:
  - type: web
    name: lendloop-backend
    runtime: node
    plan: free
    rootDir: lendloop-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these in the Render dashboard (Environment tab) — never commit
      # real secrets to the repo. sync: false means "Render will prompt for
      # this value and store it securely, but won't read it from this file".
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
